<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torneo Smash CEIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #12051f;
    --bg2: #2a0a4a;
    --fire1: #ffcc00;
    --fire2: #ff5a1f;
    --hot: #ff2e7e;
    --cyan: #3ef0ff;
    --ink: #ffffff;
    --muted: #d9c9ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0b0314; }
  body { display: flex; justify-content: center; padding: 16px; font-family: 'Rubik', system-ui, sans-serif; color: var(--ink); }

  .flyer {
    position: relative; overflow: hidden;
    width: 1080px; max-width: 100%; aspect-ratio: 4 / 5;
    background:
      radial-gradient(circle at 50% 38%, #6a1bb0 0%, transparent 55%),
      linear-gradient(160deg, var(--bg2), var(--bg1) 70%);
    border-radius: 24px;
    container-type: inline-size;
  }
  /* rayos de fondo */
  .rays {
    position: absolute; inset: -50%;
    background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.07) 0 6deg, transparent 6deg 18deg);
    transform: translateY(-6%);
  }
  .grid {
    position: absolute; left: -10%; right: -10%; bottom: 0; height: 38%;
    background:
      linear-gradient(transparent 0 0),
      repeating-linear-gradient(90deg, rgba(62,240,255,.35) 0 2px, transparent 2px 80px),
      repeating-linear-gradient(0deg, rgba(62,240,255,.35) 0 2px, transparent 2px 60px);
    transform: perspective(500px) rotateX(60deg); transform-origin: bottom;
    mask-image: linear-gradient(to top, #000 10%, transparent 95%);
  }

  .content { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 6cqw 6cqw 5cqw; text-align: center; }

  .tag {
    font-weight: 800; letter-spacing: .35em; font-size: 2.4cqw; color: var(--cyan);
    border: 2px solid var(--cyan); padding: 1cqw 3cqw; border-radius: 999px;
    text-shadow: 0 0 12px rgba(62,240,255,.7); box-shadow: 0 0 18px rgba(62,240,255,.35) inset, 0 0 18px rgba(62,240,255,.35);
  }

  .title { margin-top: 4cqw; font-family: 'Bungee', 'Impact', sans-serif; line-height: .9; transform: rotate(-4deg); }
  .title .l1 { display: block; font-size: 8cqw; color: var(--ink); text-shadow: 0.5cqw 0.5cqw 0 var(--hot); }
  .title .l2 {
    display: block; font-size: 17.5cqw; letter-spacing: -.02em;
    background: linear-gradient(180deg, var(--fire1) 20%, var(--fire2) 80%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0.8cqw 0.8cqw 0 #000) drop-shadow(0 0 2.5cqw rgba(255,90,31,.6));
  }
  .title .l3 { display: block; font-size: 7cqw; color: var(--ink); text-shadow: 0.5cqw 0.5cqw 0 #000; }

  .burst { position: absolute; width: 19cqw; top: 2cqw; right: 2cqw; transform: rotate(12deg); }
  .burst svg { width: 100%; display: block; }
  .burst span { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Bungee', Impact, sans-serif; font-size: 2.3cqw; line-height: 1.05; color: #12051f; }

  .info { margin-top: 6cqw; display: grid; grid-template-columns: 1fr 1fr; gap: 2.5cqw; width: 100%; }
  .card {
    background: rgba(18,5,31,.75); border: 3px solid rgba(255,255,255,.18); border-radius: 2cqw;
    padding: 2.6cqw 2cqw; backdrop-filter: blur(4px);
  }
  .card .k { font-size: 2.2cqw; font-weight: 800; letter-spacing: .25em; color: var(--muted); }
  .card .v { font-family: 'Bungee', Impact, sans-serif; font-size: 5cqw; margin-top: .8cqw; }
  .card .s { font-size: 2.6cqw; font-weight: 500; color: var(--muted); margin-top: .4cqw; }
  .card.when .v { color: var(--cyan); }
  .card.where .v { color: var(--hot); }

  .prizes { margin-top: 4cqw; width: 100%; }
  .prizes h2 { font-family: 'Bungee', Impact, sans-serif; font-size: 4.4cqw; letter-spacing: .08em; color: var(--fire1); text-shadow: 0.4cqw 0.4cqw 0 #000; }
  .podium { margin-top: 2.4cqw; display: grid; grid-template-columns: 1.25fr 1fr; gap: 2.5cqw; align-items: stretch; }
  .p {
    position: relative; border-radius: 2cqw; padding: 3cqw 2cqw 2.6cqw; color: #12051f;
    display: flex; flex-direction: column; justify-content: center;
    box-shadow: 0 1cqw 0 rgba(0,0,0,.45);
  }
  .p.first { background: linear-gradient(160deg, #fff27a, var(--fire1) 45%, #ff9d00); }
  .p.second { background: linear-gradient(160deg, #ffffff, #cfd8ee 50%, #9aa6c4); }
  .p .rank { font-family: 'Bungee', Impact, sans-serif; font-size: 3cqw; }
  .p .amt { font-family: 'Bungee', Impact, sans-serif; font-size: 8.6cqw; line-height: 1; margin-top: .6cqw; }
  .p.second .amt { font-size: 4.6cqw; line-height: 1.05; }
  .p .note { font-size: 2.3cqw; font-weight: 800; margin-top: .8cqw; }

  .footer { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 1.2cqw; }
  .cta {
    font-family: 'Bungee', Impact, sans-serif; font-size: 4.2cqw; padding: 1.6cqw 5cqw; border-radius: 999px;
    background: var(--hot); color: #fff; box-shadow: 0 0.8cqw 0 #8a0d3f, 0 0 3cqw rgba(255,46,126,.55);
  }
  .small { font-size: 2.3cqw; color: var(--muted); font-weight: 500; }

  .stars { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
  <div class="flyer">
    <div class="rays"></div>
    <div class="grid"></div>
    <svg class="stars" viewBox="0 0 1080 1350" aria-hidden="true">
      <g fill="#fff">
        <circle cx="90" cy="140" r="4" opacity=".8"/><circle cx="980" cy="110" r="5" opacity=".9"/>
        <circle cx="160" cy="520" r="3" opacity=".6"/><circle cx="940" cy="640" r="3" opacity=".6"/>
        <circle cx="60" cy="760" r="4" opacity=".7"/><circle cx="1020" cy="420" r="3" opacity=".7"/>
      </g>
      <g fill="#ffcc00">
        <path d="M120 300 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z"/>
        <path d="M950 250 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z"/>
      </g>
    </svg>

    <div class="content">
      <div class="tag">CEIS PRESENTA</div>

      <h1 class="title">
        <span class="l1">TORNEO DE</span>
        <span class="l2">SMASH</span>
        <span class="l3">SUPER SMASH BROS.</span>
      </h1>

      <div class="burst" aria-hidden="true">
        <svg viewBox="0 0 200 200"><polygon fill="#3ef0ff" stroke="#12051f" stroke-width="6" points="100,4 118,52 168,30 146,80 196,100 146,120 168,170 118,148 100,196 82,148 32,170 54,120 4,100 54,80 32,30 82,52"/></svg>
        <span>¡A<br>JUGAR!</span>
      </div>

      <div class="info">
        <div class="card when">
          <div class="k">CUÁNDO</div>
          <div class="v">VIE 23</div>
          <div class="s">12:00 del mediodía</div>
        </div>
        <div class="card where">
          <div class="k">DÓNDE</div>
          <div class="v">CEIS</div>
          <div class="s">¡Te esperamos!</div>
        </div>
      </div>

      <div class="prizes">
        <h2>🏆 PREMIOS 🏆</h2>
        <div class="podium">
          <div class="p first">
            <div class="rank">1er PUESTO</div>
            <div class="amt">$100K</div>
            <div class="note">premio de hasta 100.000</div>
          </div>
          <div class="p second">
            <div class="rank">2do PUESTO</div>
            <div class="amt">1 SEMANA DE COMBOS</div>
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="cta">¡INSCRÍBETE YA!</div>
        <div class="small">Trae tu control y tus ganas de ganar 🎮</div>
      </div>
    </div>
  </div>
</body>
</html>
