<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torneo Smash CEIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,800;1,800;1,900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e3001b;
    --red-dark: #8c0011;
    --gold1: #fff3a8;
    --gold2: #ffc400;
    --gold3: #d98a00;
    --silver1: #ffffff;
    --silver2: #c9d2e6;
    --silver3: #8892ad;
    --ink: #ffffff;
    --night: #0a0612;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #050309; }
  body { display: flex; justify-content: center; padding: 16px; font-family: 'Rubik', system-ui, sans-serif; color: var(--ink); }

  .flyer {
    position: relative; overflow: hidden;
    width: 1080px; max-width: 100%; aspect-ratio: 4 / 5;
    background: var(--night);
    border-radius: 24px;
    container-type: inline-size;
  }

  /* fondo: la ilustración desenfocada llena todo el flyer */
  .bg-blur {
    position: absolute; inset: -8%;
    background: url("smash-art.jpg") center 30% / cover;
    filter: blur(28px) saturate(1.4) brightness(.45);
  }
  .speed {
    position: absolute; inset: -20%;
    background: repeating-conic-gradient(from 0deg at 50% 30%, rgba(255,255,255,.06) 0 3deg, transparent 3deg 11deg);
    mask-image: linear-gradient(to bottom, transparent 40%, #000 70%);
  }

  /* ilustración nítida arriba */
  .hero {
    position: absolute; left: 0; right: 0; top: -8cqw;
    aspect-ratio: 739 / 415;
    background: url("smash-art.jpg") center / cover;
    mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
  }
  .hero::after { /* viñeta suave arriba para leer la etiqueta */
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(0,0,0,.55), transparent 40%);
  }

  .tag {
    position: absolute; top: 3.4cqw; left: 50%; transform: translateX(-50%) skewX(-14deg);
    background: var(--red); padding: 1.1cqw 4cqw; border-radius: 1cqw;
    box-shadow: 0.7cqw 0.7cqw 0 #000;
  }
  .tag span { display: block; transform: skewX(14deg); font-weight: 900; font-style: italic; font-size: 2.8cqw; letter-spacing: .18em; white-space: nowrap; }

  /* banda roja inclinada */
  .band {
    position: absolute; left: -5%; right: -5%; top: 49cqw;
    transform: rotate(-4deg);
    background: linear-gradient(90deg, var(--red-dark), var(--red) 20%, var(--red) 80%, var(--red-dark));
    padding: 1.6cqw 0 1.8cqw; text-align: center;
    border-top: 0.6cqw solid #fff; border-bottom: 0.6cqw solid #fff;
    box-shadow: 0 1.2cqw 0 rgba(0,0,0,.5);
  }
  .band h1 { font-style: italic; font-weight: 900; font-size: 7.4cqw; line-height: 1; letter-spacing: .02em; text-shadow: 0.5cqw 0.5cqw 0 rgba(0,0,0,.45); }

  /* fecha y lugar: paralelogramos */
  .info { position: absolute; top: 64.5cqw; left: 0; right: 0; display: flex; justify-content: center; gap: 4cqw; }
  .chip {
    transform: skewX(-14deg);
    background: rgba(10,6,18,.82); border: 0.5cqw solid #fff; border-radius: 1.6cqw;
    padding: 1.4cqw 4.5cqw; box-shadow: 1cqw 1cqw 0 var(--red);
  }
  .chip > div { transform: skewX(14deg); text-align: center; }
  .chip .k { font-weight: 800; font-size: 2.2cqw; letter-spacing: .3em; color: #ffb3bc; }
  .chip .v { font-weight: 900; font-style: italic; font-size: 5.4cqw; line-height: 1.05; }
  .chip .s { font-weight: 800; font-size: 2.8cqw; }

  /* premios: medallas redondas */
  .prizes { position: absolute; top: 83.5cqw; left: 0; right: 0; height: 23cqw; }
  .prizes h2 {
    position: absolute; left: 50%; top: -2.2cqw; transform: translateX(-50%) rotate(-3deg);
    font-style: italic; font-weight: 900; font-size: 4.4cqw; letter-spacing: .12em; white-space: nowrap;
    color: var(--gold2); text-shadow: 0.4cqw 0.4cqw 0 #000;
  }
  .medal {
    position: absolute; border-radius: 50%; display: grid; place-items: center; text-align: center; color: #1a0d00;
    box-shadow: 0 0 0 0.8cqw #fff, 0 0 0 1.4cqw #000, 0 1.6cqw 3cqw rgba(0,0,0,.6);
  }
  .medal.first {
    width: 23cqw; height: 23cqw; left: 19cqw; top: 3.4cqw;
    background: radial-gradient(circle at 35% 28%, var(--gold1), var(--gold2) 45%, var(--gold3) 100%);
  }
  .medal.second {
    width: 19.5cqw; height: 19.5cqw; right: 19cqw; top: 4.4cqw;
    background: radial-gradient(circle at 35% 28%, var(--silver1), var(--silver2) 50%, var(--silver3) 100%);
    color: #111a2e;
  }
  .medal .pos { font-style: italic; font-weight: 900; font-size: 2.6cqw; letter-spacing: .05em; }
  .medal .amt { font-style: italic; font-weight: 900; font-size: 6.8cqw; line-height: .95; }
  .medal .sub { font-weight: 800; font-size: 1.9cqw; margin-top: .4cqw; }
  .medal.second .amt { font-size: 2.9cqw; line-height: 1; }
  .ribbon {
    position: absolute; left: 50%; bottom: -3.4cqw; transform: translateX(-50%) skewX(-14deg);
    background: var(--red); color: #fff; padding: .6cqw 2.4cqw; border-radius: .8cqw; box-shadow: .5cqw .5cqw 0 #000;
    white-space: nowrap;
  }
  .ribbon span { display: block; transform: skewX(14deg); font-style: italic; font-weight: 900; font-size: 2.4cqw; }


  .cta {
    position: absolute; left: 50%; bottom: 2.2cqw; transform: translateX(-50%) rotate(-3deg);
    background: #fff; color: var(--red); border-radius: 999px; padding: 1.1cqw 5cqw;
    font-style: italic; font-weight: 900; font-size: 4cqw; white-space: nowrap;
    box-shadow: 0 0 0 0.6cqw var(--red), 0.9cqw 0.9cqw 0 0.6cqw #000;
  }

  .sparks { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
  <div class="flyer">
    <div class="bg-blur"></div>
    <div class="speed"></div>
    <div class="hero" role="img" aria-label="Personajes de Super Smash Bros. Ultimate"></div>

    <div class="tag"><span>CEIS PRESENTA</span></div>

    <div class="band"><h1>¡TORNEO DE SMASH!</h1></div>

    <div class="info">
      <div class="chip"><div>
        <div class="k">VIERNES</div>
        <div class="v">23</div>
        <div class="s">12:00 MEDIODÍA</div>
      </div></div>
      <div class="chip"><div>
        <div class="k">LUGAR</div>
        <div class="v">CEIS</div>
        <div class="s">¡TE ESPERAMOS!</div>
      </div></div>
    </div>

    <div class="prizes">
      <h2>★ PREMIOS ★</h2>
      <div class="medal first">
        <div>
          <div class="pos">1° PUESTO</div>
          <div class="amt">$100K</div>
          <div class="sub">HASTA 100.000</div>
        </div>
        <div class="ribbon"><span>CAMPEÓN</span></div>
      </div>
      <div class="medal second">
        <div>
          <div class="pos">2° PUESTO</div>
          <div class="amt">1 SEMANA<br>DE COMBOS</div>
        </div>
        <div class="ribbon"><span>SUBCAMPEÓN</span></div>
      </div>
    </div>

    <div class="cta">¡NO FALTES!</div>

    <svg class="sparks" viewBox="0 0 1080 1350" aria-hidden="true">
      <g fill="#ffc400">
        <path d="M70 1060 l12 30 30 12 -30 12 -12 30 -12 -30 -30 -12 30 -12z"/>
        <path d="M1000 1100 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9z"/>
        <path d="M110 760 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7z" fill="#fff"/>
        <path d="M975 760 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7z" fill="#fff"/>
      </g>
    </svg>
  </div>
</body>
</html>
